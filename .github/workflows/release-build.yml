name: FlyingLyte Release Build Check

on:
  push:
    branches:
      - release/seasonal-ui-20261117
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Security Audit and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check security vulnerabilities
        run: npm audit --audit-level=high

      - name: Build production website
        run: npm run build
